<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peremember — Remember before you forget</title>
<meta name="theme-color" content="#211E19">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper: #F6F2E9;
    --surface: #FFFEFB;
    --ink: #211E19;
    --muted: #8B8377;
    --rule: #E5DFD1;
    --mark-date: #F0C743;
    --mark-date-ink: #4A3B08;
    --mark-priority: #E8785A;
    --mark-priority-ink: #4A1D0D;
    --mark-high: #E8B25A;
    --mark-high-ink: #4A2F08;
    --green: #4F7A5C;
    --red: #C1523B;
  }
  :root.dark-theme{
    --paper: #1B1712;
    --surface: #241F19;
    --ink: #F2EBDD;
    --muted: #A79C89;
    --rule: #3A332B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    transition: background-color 0.25s ease, color 0.25s ease;
    background: var(--paper); color: var(--ink); font-family: 'Public Sans', sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .serif{ font-family: 'Fraunces', serif; }
  .mono{ font-family: 'IBM Plex Mono', monospace; }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 24px; }
  .hidden{ display:none !important; }

  header{ padding: 40px 24px 6px; text-align:center; position:relative; }
  .wordmark{ font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .tagline{ font-size: 14px; color: var(--muted); font-style: italic; margin-top: 4px; }
  .top-right{
    position:absolute; top: 42px; right: 24px; font-size: 12px; color: var(--muted);
    display:flex; align-items:center; gap: 10px;
  }
  .kbd-hint{ display:flex; align-items:center; gap: 5px; }
  #notifyBtn, #themeToggle{
    background:none; border: 1px solid var(--rule); color: var(--muted); font-size: 12px;
    padding: 5px 11px; border-radius: 20px; cursor:pointer; font-family: inherit;
  }
  #themeToggle{ padding: 5px 9px; font-size: 13px; line-height:1; }
  #notifyBtn.on{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #themeToggle:hover{ border-color: var(--ink); }

  .avatar-wrap{ position:relative; }
  #avatarBtn{
    width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--paper);
    border: none; font-family: 'Fraunces', serif; font-size: 12.5px; font-weight: 600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .avatar-menu{
    position:absolute; top: 34px; right: 0; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 10px; min-width: 190px; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.25);
    padding: 6px; z-index: 50;
  }
  .avatar-email{
    font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--rule);
    margin-bottom: 4px; word-break: break-all;
  }
  .avatar-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color: var(--ink);
    font-size: 13px; padding: 8px 10px; border-radius: 6px; cursor:pointer; font-family: inherit;
  }
  .avatar-menu button:hover{ background: var(--paper); }
  .live-dot{
    width: 6px; height: 6px; border-radius: 50%; background: var(--green); display:inline-block;
    margin-right: 5px; box-shadow: 0 0 0 0 rgba(79,122,94,0.5); animation: livepulse 2s infinite;
  }
  @keyframes livepulse{ 0%{ box-shadow: 0 0 0 0 rgba(79,122,94,0.4); } 70%{ box-shadow: 0 0 0 6px rgba(79,122,94,0); } 100%{ box-shadow: 0 0 0 0 rgba(79,122,94,0); } }

  .auth-shell{ max-width: 380px; margin: 60px auto; padding: 0 24px; }
  .auth-card{ background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 28px 26px; }
  .auth-title{ font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .auth-sub{ font-size: 13.5px; color: var(--muted); margin-bottom: 22px; }
  .field-label{ font-size: 12.5px; color: var(--muted); margin-bottom: 6px; display:block; }
  .field{
    width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px;
    font-family: inherit; font-size: 14.5px; background: var(--paper); margin-bottom: 14px; outline: none;
  }
  .field:focus{ border-color: var(--green); }
  .auth-btn{
    width: 100%; background: var(--ink); color: var(--paper); border: none;
    font-size: 14px; font-weight: 500; padding: 11px; border-radius: 8px; cursor: pointer;
    font-family: inherit; margin-top: 4px;
  }
  .auth-btn:disabled{ opacity: 0.5; cursor: default; }
  .auth-switch{ text-align:center; font-size: 13px; color: var(--muted); margin-top: 16px; }
  .auth-switch button{ background:none; border:none; color: var(--green); font-weight: 500; cursor:pointer; font-family: inherit; font-size: 13px; padding: 0; }
  .auth-error{ background: #FBE6E1; color: var(--red); font-size: 12.5px; padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; }
  .auth-note{ background: #FBF0CB; color: var(--mark-date-ink); font-size: 12.5px; padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; }

  .stats{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--rule); border: 1px solid var(--rule); border-radius: 12px;
    overflow:hidden; margin: 24px 24px 0;
  }
  .stat{ background: var(--surface); padding: 16px 14px; text-align:center; }
  .stat-num{ font-size: 22px; font-weight: 600; font-family: 'Fraunces', serif; }
  .stat-num.streak{ color: var(--mark-priority-ink); }
  .stat-label{ font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; text-transform: uppercase; }

  .composer{ padding: 22px 24px 8px; }
  .input-shell{ background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; }
  input#taskInput{
    width: 100%; border: none; outline: none; background: transparent;
    font-family: 'Fraunces', serif; font-size: 19px; color: var(--ink);
  }
  input#taskInput::placeholder{ color: #B9B2A2; }
  .preview-line{
    min-height: 22px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule);
    font-size: 15px; color: var(--muted); display:none;
  }
  .preview-line.show{ display:block; }
  mark.date{ background: var(--mark-date); color: var(--mark-date-ink); padding: 1px 3px; border-radius: 3px; }
  mark.priority{ background: var(--mark-priority); color: var(--mark-priority-ink); padding: 1px 3px; border-radius: 3px; }
  mark.high{ background: var(--mark-high); color: var(--mark-high-ink); padding: 1px 3px; border-radius: 3px; }
  .chips{ display:flex; gap: 8px; margin-top: 14px; flex-wrap:wrap; }
  .chip{ font-size: 12px; padding: 5px 11px; border-radius: 20px; display:flex; align-items:center; gap: 6px; }
  .chip .k{ color: var(--muted); }
  .chip.due{ background: #FBF0CB; color: var(--mark-date-ink); }
  .chip.pr-urgent{ background: #F9D8CC; color: var(--mark-priority-ink); }
  .chip.pr-high{ background: #F7E2C0; color: var(--mark-high-ink); }
  .chip.pr-normal{ background: #E9E4D6; color: var(--muted); }
  .hint-row{ display:flex; justify-content:space-between; align-items:center; margin-top: 16px; }
  .hint{ font-size: 12.5px; color: var(--muted); }
  .hint b{ color: var(--ink); font-weight: 500; }
  button#addBtn{
    background: var(--ink); color: var(--paper); border: none; font-size: 13.5px; font-weight: 500;
    padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  button#addBtn:disabled{ opacity: 0.35; cursor: default; }

  .controls{ padding: 22px 24px 0; display:flex; flex-direction:column; gap: 12px; }
  .controls-top{ display:flex; gap: 10px; align-items:center; }
  .search-shell{
    flex:1; display:flex; align-items:center; gap: 8px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 8px 14px;
  }
  .search-shell svg{ flex-shrink:0; opacity: 0.5; }
  #searchInput{ border:none; outline:none; background:transparent; font-family: inherit; font-size: 13.5px; width:100%; color: var(--ink); }
  #searchInput::placeholder{ color: #B9B2A2; }
  .view-toggle{ display:flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 3px; flex-shrink:0; }
  .view-btn{
    background:none; border:none; font-size: 12px; padding: 6px 13px; border-radius: 16px; cursor:pointer;
    font-family: inherit; color: var(--muted);
  }
  .view-btn.active{ background: var(--ink); color: var(--paper); }
  .filter-row{ display:flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn{
    font-size: 12.5px; padding: 6px 13px; border-radius: 20px; border: 1px solid var(--rule);
    background: var(--surface); color: var(--muted); cursor:pointer; font-family: inherit;
  }
  .filter-btn.active{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .board{ padding: 20px 24px 90px; }
  .group{ margin-bottom: 6px; }
  .group-label{ font-size: 11.5px; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 10px; font-family: 'IBM Plex Mono', monospace; }
  .group:first-child .group-label{ margin-top: 0; }
  .task-row{
    display:flex; align-items:center; gap: 14px; padding: 16px 16px 16px 14px;
    background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--rule);
    border-radius: 12px; margin-bottom: 10px; cursor: pointer;
    animation: rowIn 0.28s ease; transition: box-shadow 0.15s, transform 0.1s;
  }
  .task-row:hover{ box-shadow: 0 4px 14px -6px rgba(33,30,25,0.18); transform: translateY(-1px); }
  .task-row.accent-urgent{ border-left-color: var(--mark-priority); }
  .task-row.accent-high{ border-left-color: var(--mark-high); }
  .task-row.accent-normal{ border-left-color: var(--green); }
  .task-row.is-done{ opacity: 0.6; }
  @keyframes rowIn{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform: translateY(0); } }
  .task-row.removing{ animation: rowOut 0.22s ease forwards; }
  @keyframes rowOut{ to{ opacity:0; transform: translateX(14px); height:0; padding-top:0; padding-bottom:0; margin:0; border:none; } }
  .check{
    width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid #C9C1AE; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background: var(--surface); transition: transform 0.15s;
  }
  .check.pulse{ animation: pulse 0.35s ease; }
  @keyframes pulse{ 50%{ transform: scale(1.35); } }
  .check.done{ background: var(--green); border-color: var(--green); }
  .check.done::after{ content:'✓'; color: var(--surface); font-size: 12px; }
  .task-body{ flex:1; min-width:0; }
  .task-title{ font-size: 15.5px; }
  .task-title.done{ text-decoration: line-through; color: var(--muted); }
  .task-title mark{ background: var(--mark-date); padding: 0 2px; border-radius: 2px; }
  .task-sub{ font-size: 11.5px; color: var(--muted); margin-top: 4px; font-family: 'IBM Plex Mono', monospace; }
  .task-sub .sep{ margin: 0 5px; opacity: 0.5; }
  .task-title-edit{
    flex:1; font-size: 15.5px; font-family: inherit; border: none; outline: none;
    background: var(--surface); border-bottom: 1px solid var(--green); padding: 2px 0;
  }
  .task-meta{ display:flex; gap: 8px; align-items:center; flex-shrink:0; }
  .badge{ font-size: 11px; padding: 3px 9px; border-radius: 20px; font-family: 'IBM Plex Mono', monospace; }
  .badge.urgent{ background: #F9D8CC; color: var(--mark-priority-ink); }
  .badge.high{ background: #F7E2C0; color: var(--mark-high-ink); }
  .del{ background:none; border:none; color: var(--muted); font-size: 18px; cursor:pointer; opacity: 0; transition: opacity 0.15s; padding: 4px; flex-shrink:0; }
  .task-row:hover .del{ opacity: 1; }

  /* TASK DETAIL MODAL */
  .modal-overlay{
    position: fixed; inset: 0; background: rgba(33,30,25,0.45); z-index: 100;
    display:flex; align-items:center; justify-content:center; padding: 20px;
    animation: overlayIn 0.18s ease;
  }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-card{
    background: var(--surface); border-radius: 18px; max-width: 420px; width: 100%;
    padding: 26px 24px 22px; box-shadow: 0 30px 70px -20px rgba(33,30,25,0.4);
    animation: modalIn 0.22s cubic-bezier(.2,.8,.3,1.1);
    max-height: 85vh; overflow-y: auto;
  }
  @keyframes modalIn{ from{ opacity:0; transform: scale(0.93) translateY(10px); } to{ opacity:1; transform: scale(1) translateY(0); } }
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 4px; }
  .modal-eyebrow{ font-size: 11px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; }
  .modal-close{ background:none; border:none; font-size: 20px; color: var(--muted); cursor:pointer; line-height:1; padding: 2px 6px; }
  .modal-close:hover{ color: var(--ink); }
  .modal-title-input{
    width:100%; font-family: 'Fraunces', serif; font-size: 22px; border:none; outline:none;
    background: transparent; color: var(--ink); margin: 6px 0 20px; padding: 2px 0;
    border-bottom: 1px solid transparent;
  }
  .modal-title-input:focus{ border-bottom: 1px solid var(--green); }
  .modal-section{ margin-bottom: 18px; }
  .modal-label{ font-size: 11px; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-family: 'IBM Plex Mono', monospace; }
  .shifter{
    display:flex; align-items:center; justify-content:space-between; background: var(--paper);
    border: 1px solid var(--rule); border-radius: 10px; padding: 4px;
  }
  .shifter-btn{
    background: var(--surface); border: 1px solid var(--rule); width: 32px; height: 32px; border-radius: 8px;
    font-size: 16px; cursor:pointer; color: var(--ink); flex-shrink:0;
  }
  .shifter-btn:hover{ background: var(--ink); color: var(--paper); }
  .shifter-val{ font-size: 14px; font-weight: 500; text-align:center; flex:1; }
  .modal-nodate{
    width:100%; background: var(--paper); border: 1px dashed var(--rule); border-radius: 10px;
    padding: 12px; font-size: 13.5px; color: var(--muted); cursor:pointer; font-family: inherit;
  }
  .modal-nodate:hover{ border-color: var(--green); color: var(--green); }
  .priority-chips{ display:flex; gap: 8px; }
  .pchip{
    flex:1; padding: 9px; border-radius: 9px; border: 1px solid var(--rule); background: var(--surface);
    font-size: 12.5px; text-align:center; cursor:pointer; color: var(--muted); font-family: inherit;
  }
  .pchip.active.normal{ background: var(--green); border-color: var(--green); color: var(--surface); }
  .pchip.active.high{ background: var(--mark-high); border-color: var(--mark-high); color: var(--mark-high-ink); }
  .pchip.active.urgent{ background: var(--mark-priority); border-color: var(--mark-priority); color: var(--surface); }
  .modal-actions{ display:flex; gap: 10px; margin-top: 22px; }
  .modal-done-btn{
    flex:1; padding: 12px; border-radius: 10px; border: none; background: var(--ink); color: var(--paper);
    font-size: 13.5px; font-weight: 500; cursor:pointer; font-family: inherit;
  }
  .modal-done-btn.is-done{ background: var(--green); }
  .modal-delete-btn{
    padding: 12px 16px; border-radius: 10px; border: 1px solid #F0C9BE; background: #FBE6E1; color: var(--red);
    font-size: 13.5px; cursor:pointer; font-family: inherit;
  }


  .kanban{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 20px 24px 90px; }
  .kcol{ background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; min-height: 120px; }
  .kcol-label{ font-size: 11px; letter-spacing: 0.05em; color: var(--muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 12px; text-transform: uppercase; }
  .kcard{
    background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; font-size: 13.5px; cursor:pointer; animation: rowIn 0.28s ease;
  }
  .kcard.done{ opacity: 0.5; text-decoration: line-through; }
  .kcard-badge{ display:inline-block; margin-top: 6px; font-size: 10px; padding: 2px 7px; border-radius: 12px; font-family: 'IBM Plex Mono', monospace; }
  .kcard-badge.urgent{ background: #F9D8CC; color: var(--mark-priority-ink); }
  .kcard-badge.high{ background: #F7E2C0; color: var(--mark-high-ink); }

  .cal-strip{ display:flex; gap: 8px; padding: 20px 24px 4px; overflow-x:auto; }
  .cal-day{
    flex-shrink:0; width: 74px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 10px 8px; text-align:center; cursor:pointer;
  }
  .cal-day.selected{ background: var(--ink); border-color: var(--ink); }
  .cal-day.selected .cal-dow, .cal-day.selected .cal-num{ color: var(--paper); }
  .cal-dow{ font-size: 10.5px; color: var(--muted); text-transform:uppercase; }
  .cal-num{ font-size: 17px; font-weight: 600; font-family: 'Fraunces', serif; margin: 2px 0; }
  .cal-dot{ width: 5px; height: 5px; border-radius: 50%; background: var(--mark-priority); margin: 2px auto 0; visibility:hidden; }
  .cal-dot.show{ visibility:visible; }
  .cal-day.selected .cal-dot{ background: var(--mark-date); }

  .empty{ text-align:center; padding: 40px 20px; color: var(--muted); }
  .empty .serif{ font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .empty p{ font-size: 13.5px; }

  .toast{
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); font-size: 13.5px; padding: 12px 18px; border-radius: 8px;
    display:flex; align-items:center; gap: 14px; opacity: 0; pointer-events:none; transition: all 0.25s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); pointer-events:auto; }
  .toast button{ background:none; border:none; color: var(--mark-date); font-weight:600; font-size:13px; cursor:pointer; font-family: inherit; }

  @media (max-width: 640px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
    .kanban{ grid-template-columns: 1fr 1fr; }
    .task-meta{ flex-direction: column-reverse; align-items: flex-end; gap: 4px; }
    .kbd-hint{ display:none; }
    header{ padding: 20px 90px 6px 20px; text-align:left; }
    .wordmark{ font-size: 19px; }
    .tagline{ font-size: 11.5px; }
    .top-right{
      top: 18px; right: 16px; flex-direction: column; align-items: flex-end; gap: 6px;
    }
    #notifyBtn, #themeToggle{ font-size: 10.5px; padding: 4px 9px; }
  }
  :focus-visible{ outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <div class="wordmark serif">Peremember</div>
  <div class="tagline serif">Remember before you forget.</div>
  <div class="top-right hidden" id="topRight">
    <span class="kbd-hint"><span class="live-dot" id="liveDot"></span>Live</span>
    <button id="notifyBtn">🔔 Reminders</button>
    <button id="themeToggle" title="Toggle dark mode">🌙</button>
    <div class="avatar-wrap">
      <button id="avatarBtn"></button>
      <div class="avatar-menu hidden" id="avatarMenu">
        <div class="avatar-email" id="avatarEmail"></div>
        <button id="signOutBtn">Sign out</button>
      </div>
    </div>
  </div>
</header>

<div id="authScreen" class="auth-shell">
  <div class="auth-card">
    <div class="auth-title serif" id="authTitle">Welcome back</div>
    <div class="auth-sub" id="authSub">Sign in to see your tasks.</div>
    <div id="authError" class="auth-error hidden"></div>
    <div id="authNote" class="auth-note hidden"></div>
    <label class="field-label">Email</label>
    <input id="authEmail" class="field" type="email" placeholder="you@example.com" autocomplete="email">
    <label class="field-label">Password</label>
    <input id="authPassword" class="field" type="password" placeholder="At least 6 characters" autocomplete="current-password">
    <button id="authSubmit" class="auth-btn">Sign in</button>
    <div class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <button id="authSwitchBtn">Sign up</button>
    </div>
  </div>
</div>

<div id="app" class="wrap hidden">

  <div class="stats" id="statsBar">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="statToday">0</div><div class="stat-label">Done today</div></div>
    <div class="stat"><div class="stat-num streak" id="statStreak">0</div><div class="stat-label">Day streak</div></div>
    <div class="stat"><div class="stat-num" id="statRate">0%</div><div class="stat-label">Completion</div></div>
  </div>

  <div class="composer">
    <div class="input-shell">
      <input id="taskInput" type="text" placeholder="✨ Capture an idea, task or memory" autocomplete="off">
      <div class="preview-line mono" id="previewLine"></div>
      <div class="chips" id="chips"></div>
      <div class="hint-row">
        <div class="hint">Press <b>Enter</b> to save</div>
        <button id="addBtn" disabled>Add task</button>
      </div>
    </div>
  </div>

  var DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function nextWeekday(fromDate, targetDow, hour, minute){
    var d = startOfDay(fromDate);
    var diff = (targetDow - d.getDay() + 7) % 7;
    if(diff === 0) diff = 7;
    d.setDate(d.getDate() + diff);
    d.setHours(hour, minute, 0, 0);
    return d;
  }
  function to12h(h, m){
    var period = h >= 12 ? 'PM' : 'AM';
    var hh = h % 12; if(hh === 0) hh = 12;
    var mm = m < 10 ? '0' + m : '' + m;
    return hh + ':' + mm + ' ' + period;
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function sameDay(a,b){ return startOfDay(a).getTime() === startOfDay(b).getTime(); }

  function parseTask(raw){
    var text = raw.trim();
    var now = new Date();
    var matches = [];
    var priority = 'Normal';
    var dueDate = null;
    var dueLabel = null;
    var explicitTime = null;

    var timeRe = /\bby\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i;
    var tm = timeRe.exec(text);
    if(tm){
      var h = parseInt(tm[1], 10);
      var min = tm[2] ? parseInt(tm[2], 10) : 0;
      var period = tm[3] ? tm[3].toLowerCase() : null;
      if(period === 'pm' && h < 12) h += 12;
      if(period === 'am' && h === 12) h = 0;
      if(!period && h < 8) h += 12;
      explicitTime = { h: h, m: min };
      matches.push({start:tm.index, end:tm.index+tm[0].length, cls:'date'});
    }

    var urgentRe = /\b(urgent|asap)\b/i;
    var highRe = /\b(important|high priority|high)\b/i;
    var m = urgentRe.exec(text);
    if(m){ priority = 'Urgent'; matches.push({start:m.index, end:m.index+m[0].length, cls:'priority'}); }
    else{
      m = highRe.exec(text);
      if(m){ priority = 'High'; matches.push({start:m.index, end:m.index+m[0].length, cls:'high'}); }
    }

    var beforeDayRe = /\bbefore\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i;
    var onDayRe = /\b(?:on\s+|next\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i;
    var tomorrowRe = /\btomorrow\b/i;
    var todayRe = /\btoday\b/i;

    var dm = beforeDayRe.exec(text);
    if(dm){
      var dow = DAYS.indexOf(dm[1].toLowerCase());
      var hh1 = explicitTime ? explicitTime.h : 9, mm1 = explicitTime ? explicitTime.m : 0;
      dueDate = nextWeekday(now, dow, hh1, mm1);
      dueLabel = 'Before ' + cap(dm[1]) + ', ' + to12h(hh1, mm1);
      matches.push({start:dm.index, end:dm.index+dm[0].length, cls:'date'});
    } else if((dm = tomorrowRe.exec(text))){
      var hh2 = explicitTime ? explicitTime.h : 17, mm2 = explicitTime ? explicitTime.m : 0;
      var t = startOfDay(now); t.setDate(t.getDate()+1); t.setHours(hh2, mm2, 0, 0);
      dueDate = t; dueLabel = 'Tomorrow, ' + to12h(hh2, mm2);
      matches.push({start:dm.index, end:dm.index+dm[0].length, cls:'date'});
    } else if((dm = todayRe.exec(text))){
      var hh3 = explicitTime ? explicitTime.h : 17, mm3 = explicitTime ? explicitTime.m : 0;
      var t2 = startOfDay(now); t2.setHours(hh3, mm3, 0, 0);
      dueDate = t2; dueLabel = 'Today, ' + to12h(hh3, mm3);
      matches.push({start:dm.index, end:dm.index+dm[0].length, cls:'date'});
    } else if((dm = onDayRe.exec(text))){
      var dow2 = DAYS.indexOf(dm[1].toLowerCase());
      var hh4 = explicitTime ? explicitTime.h : 17, mm4 = explicitTime ? explicitTime.m : 0;
      dueDate = nextWeekday(now, dow2, hh4, mm4);
      dueLabel = cap(dm[1]) + ', ' + to12h(hh4, mm4);
      matches.push({start:dm.index, end:dm.index+dm[0].length, cls:'date'});
    } else if(explicitTime){
      var hh5 = explicitTime.h, mm5 = explicitTime.m;
      var t3 = startOfDay(now); t3.setHours(hh5, mm5, 0, 0);
      if(t3.getTime() < now.getTime()) t3.setDate(t3.getDate()+1);
      dueDate = t3; dueLabel = 'Today, ' + to12h(hh5, mm5);
    }

    matches.sort(function(a,b){ return a.start - b.start; });
    var cleanChars = text.split('');
    matches.forEach(function(mm){
      for(var i=mm.start;i<mm.end;i++) cleanChars[i] = '\u0000';
    });
    var title = cleanChars.join('')
      .replace(/\u0000/g,' ').replace(/,/g,' ').replace(/\s{2,}/g,' ')
      .replace(/^\s+|\s+$/g,'').replace(/\s+([.!?])$/,'$1');
    title = title.charAt(0).toUpperCase() + title.slice(1);

    return { title: title, due: dueLabel, dueDate: dueDate ? dueDate.toISOString() : null, priority: priority, matches: matches, rawText: text };
  }

  function highlightHTML(text, matches){
    if(matches.length === 0) return escapeHTML(text);
    var out = ''; var last = 0;
    matches.forEach(function(m){
      out += escapeHTML(text.slice(last, m.start));
      out += '<mark class="' + m.cls + '">' + escapeHTML(text.slice(m.start, m.end)) + '</mark>';
      last = m.end;
    });
    out += escapeHTML(text.slice(last));
    return out;
  }
  function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function highlightSearch(text, q){
    if(!q) return escapeHTML(text);
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return escapeHTML(text);
    return escapeHTML(text.slice(0,idx)) + '<mark>' + escapeHTML(text.slice(idx,idx+q.length)) + '</mark>' + escapeHTML(text.slice(idx+q.length));
  }

  function updateNotifyBtn(){
    var enabled = ('Notification' in window) && localStorage.getItem('peremember_reminders') === 'on' && Notification.permission === 'granted';
    notifyBtn.classList.toggle('on', enabled);
    notifyBtn.textContent = enabled ? '🔔 Reminders on' : '🔔 Reminders';
  }
  function showBrowserNotification(title, body, tag){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(title, { body: body, icon: 'icon-192.png', badge: 'icon-192.png', tag: tag });
      }).catch(function(){
        new Notification(title, { body: body, icon: 'icon-192.png' });
      });
    } else {
      new Notification(title, { body: body, icon: 'icon-192.png' });
    }
  }
  function checkDueNotifications(){
    if(!('Notification' in window)) return;
    if(localStorage.getItem('peremember_reminders') !== 'on') return;
    if(Notification.permission !== 'granted') return;
    var now = new Date().getTime();
    tasks.forEach(function(t){
      if(t.completed || !t.due_date || notifiedIds[t.id]) return;
      var due = new Date(t.due_date).getTime();
      var diff = due - now;
      if(diff <= 15*60*1000 && diff >= -5*60*1000){
        showBrowserNotification('Peremember', t.title + (t.due ? ' — due ' + t.due : ''), String(t.id));
        notifiedIds[t.id] = true;
        saveNotifiedIds();
      }
    });
  }
  notifyBtn.addEventListener('click', async function(){
    if(!('Notification' in window)){

    if(localStorage.getItem('peremember_reminders') === 'on'){
      localStorage.setItem('peremember_reminders', 'off');
      updateNotifyBtn();
      return;
    }
    var perm = await Notification.requestPermission();
    if(perm === 'granted'){
      localStorage.setItem('peremember_reminders', 'on');
      showBrowserNotification('Peremember', 'Reminders are on. We\u2019ll nudge you when a task is due.', 'welcome');
    }
    updateNotifyBtn();

  function subscribeRealtime(){
    if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    realtimeChannel = supabase.channel('tasks-changes-' + currentUserId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: 'user_id=eq.' + currentUserId }, function(payload){
        if(payload.eventType === 'INSERT'){
          if(!tasks.some(function(t){ return String(t.id) === String(payload.new.id); })){
            tasks.unshift(payload.new);
          }
        } else if(payload.eventType === 'UPDATE'){
          var idx = tasks.findIndex(function(t){ return String(t.id) === String(payload.new.id); });
          if(idx !== -1) tasks[idx] = payload.new;
        } else if(payload.eventType === 'DELETE'){
          tasks = tasks.filter(function(t){ return String(t.id) !== String(payload.old.id); });
        }
        renderAll();
        checkDueNotifications();
      })
      .subscribe();
  }

  async function addTask(){

    if(!val || !currentUserId) return;
    var parsed = parseTask(val);

    var res = await supabase.from('tasks').insert({
      user_id: currentUserId, user_email: currentUserEmail, title: parsed.title || val, due: parsed.due,
      due_date: parsed.dueDate, priority: parsed.priority, completed: false
    }).select();
    if(res.error){ console.error(res.error); addBtn.disabled = false; return; }
    if(!tasks.some(function(t){ return String(t.id) === String(res.data[0].id); })){

  function groupLabelFor(task){
    if(!task.due_date) return 'No date';
    var d = startOfDay(new Date(task.due_date));
    var today = startOfDay(new Date());
    var tmw = new Date(today); tmw.setDate(tmw.getDate()+1);
    var weekOut = new Date(today); weekOut.setDate(weekOut.getDate()+7);
    if(d.getTime() === today.getTime()) return 'Today';
    if(d.getTime() === tmw.getTime()) return 'Tomorrow';
    if(d.getTime() < weekOut.getTime()) return 'This week';
    return 'Later';
  }

  function getFilteredTasks(){
    var active = currentFilter === 'all' ? tasks : tasks.filter(function(t){ return t.priority === currentFilter; });
    if(searchQuery){
      active = active.filter(function(t){ return t.title.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1; });
    }
    return active;
  }

  function renderStats(){
    var total = tasks.length;
    var todayStr = startOfDay(new Date()).toDateString();
    var doneToday = tasks.filter(function(t){
      return t.completed && t.completed_at && startOfDay(new Date(t.completed_at)).toDateString() === todayStr;
    }).length;
    var doneCount = tasks.filter(function(t){ return t.completed; }).length;
    var rate = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    var completedDates = {};
    tasks.forEach(function(t){
      if(t.completed && t.completed_at){
        completedDates[startOfDay(new Date(t.completed_at)).toDateString()] = true;
      }
    });
    var streak = 0;
    var cursor = startOfDay(new Date());
    while(completedDates[cursor.toDateString()]){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }

    statTotal.textContent = total;
    statToday.textContent = doneToday;
    statStreak.textContent = streak;
    statRate.textContent = rate + '%';
  }

  function accentClass(priority){

  function taskRowHTML(t, query){

    if(active.length === 0){
      board.innerHTML = '<div class="empty"><div class="serif">Nothing on this day.</div><p>Pick another date or add a task.</p></div>';
      return;
    }
    var html = '<div class="group"><div class="group-label">' + active.length + ' TASK' + (active.length > 1 ? 'S' : '') + '</div>';
    active.forEach(function(t){ html += taskRowHTML(t, ''); });
    html += '</div>';
    board.innerHTML = html;
  }

  function renderAll(){
    renderStats();
    if(currentView === 'list'){
      board.classList.remove('hidden'); kanban.classList.add('hidden'); calStrip.classList.add('hidden');
      renderList();
    } else if(currentView === 'board'){
      board.classList.add('hidden'); kanban.classList.remove('hidden'); calStrip.classList.add('hidden');
      renderKanban();
    } else {
      board.classList.remove('hidden'); kanban.classList.add('hidden'); calStrip.classList.remove('hidden');
      renderCalStrip();
      renderCalendarList();
    }
  }

  async function toggleTask(id){
    var idx = tasks.findIndex(function(t){ return String(t.id) === String(id); });
    if(idx === -1) return;
    var newVal = !tasks[idx].completed;
    var completedAt = newVal ? new Date().toISOString() : null;
    tasks[idx].completed = newVal;
    tasks[idx].completed_at = completedAt;
    renderAll();
    if(openTaskId && String(openTaskId) === String(id)) renderModal();
    await supabase.from('tasks').update({ completed: newVal, completed_at: completedAt }).eq('id', id);
  }

  async function updateTaskField(id, fields){
    var idx = tasks.findIndex(function(t){ return String(t.id) === String(id); });
    if(idx === -1) return;
    Object.keys(fields).forEach(function(k){ tasks[idx][k] = fields[k]; });
    renderAll();
    if(openTaskId && String(openTaskId) === String(id)) renderModal();
    await supabase.from('tasks').update(fields).eq('id', id);
  }

  function formatDueLabel(d){
    var today = startOfDay(new Date());
    var day = startOfDay(d);
    var diffDays = Math.round((day - today) / 86400000);
    var timePart = to12h(d.getHours(), d.getMinutes());
    if(diffDays === 0) return 'Today, ' + timePart;
    if(diffDays === 1) return 'Tomorrow, ' + timePart;
    if(diffDays === -1) return 'Yesterday, ' + timePart;
    if(diffDays > 1 && diffDays < 7) return d.toLocaleDateString('en-US',{weekday:'long'}) + ', ' + timePart;
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + timePart;
  }

  var modalOverlay = document.getElementById('modalOverlay');
  var modalCard = document.getElementById('modalCard');
  var openTaskId = null;

  function openTaskModal(id){
    openTaskId = id;
    renderModal();
    modalOverlay.classList.remove('hidden');
  }
  function closeTaskModal(){
    openTaskId = null;
    modalOverlay.classList.add('hidden');
    modalCard.innerHTML = '';
  }

  function renderModal(){
    var t = tasks.find(function(x){ return String(x.id) === String(openTaskId); });
    if(!t){ closeTaskModal(); return; }
    var dueDateObj = t.due_date ? new Date(t.due_date) : null;
    var dateStr = dueDateObj ? dueDateObj.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}) : null;
    var timeStr = dueDateObj ? to12h(dueDateObj.getHours(), dueDateObj.getMinutes()) : null;

    var dateSection = '';
    if(dueDateObj){
      dateSection =
        '<div class="modal-section"><div class="modal-label">Date</div>' +
          '<div class="shifter">' +
            '<button class="shifter-btn" data-action="date-prev">\u2039</button>' +
            '<span class="shifter-val">' + dateStr + '</span>' +
            '<button class="shifter-btn" data-action="date-next">\u203a</button>' +
          '</div>' +
        '</div>' +
        '<div class="modal-section"><div class="modal-label">Time</div>' +
          '<div class="shifter">' +
            '<button class="shifter-btn" data-action="time-prev">\u2039</button>' +
            '<span class="shifter-val">' + timeStr + '</span>' +
            '<button class="shifter-btn" data-action="time-next">\u203a</button>' +
          '</div>' +
        '</div>';
    } else {
      dateSection = '<div class="modal-section"><button class="modal-nodate" data-action="set-date">+ Set a due date</button></div>';
    }

    modalCard.innerHTML =
      '<div class="modal-top"><span class="modal-eyebrow">Task</span><button class="modal-close" data-action="close">\u00d7</button></div>' +
      '<input class="modal-title-input serif" id="modalTitleInput" value="' + escapeHTML(t.title).replace(/"/g,'&quot;') + '">' +
      dateSection +
      '<div class="modal-section"><div class="modal-label">Priority</div>' +
        '<div class="priority-chips">' +
          '<button class="pchip normal' + (t.priority==='Normal'?' active':'') + '" data-action="priority" data-value="Normal">Normal</button>' +
          '<button class="pchip high' + (t.priority==='High'?' active':'') + '" data-action="priority" data-value="High">High</button>' +
          '<button class="pchip urgent' + (t.priority==='Urgent'?' active':'') + '" data-action="priority" data-value="Urgent">Urgent</button>' +
        '</div>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="modal-done-btn' + (t.completed?' is-done':'') + '" data-action="toggle-done">' + (t.completed ? '\u2713 Completed' : 'Mark as done') + '</button>' +
        '<button class="modal-delete-btn" data-action="delete-task">Delete</button>' +
      '</div>';

    var titleInput = document.getElementById('modalTitleInput');
    titleInput.addEventListener('blur', function(){
      var newTitle = titleInput.value.trim();
      if(newTitle && newTitle !== t.title) updateTaskField(t.id, { title: newTitle });
    });
    titleInput.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter') titleInput.blur();
    });
  }

  modalOverlay.addEventListener('click', function(e){
    if(e.target === modalOverlay) closeTaskModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && openTaskId) closeTaskModal();
  });

  modalCard.addEventListener('click', async function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var t = tasks.find(function(x){ return String(x.id) === String(openTaskId); });
    if(!t) return;
    var action = btn.getAttribute('data-action');

    if(action === 'close'){
      closeTaskModal();
    } else if(action === 'toggle-done'){
      await toggleTask(t.id);
    } else if(action === 'delete-task'){
      var id = t.id;
      closeTaskModal();
      var idx = tasks.findIndex(function(x){ return String(x.id) === String(id); });
      if(idx !== -1){
        lastDeleted = { task: tasks[idx], index: idx };
        tasks = tasks.filter(function(x){ return String(x.id) !== String(id); });
        renderAll();
      }
      showToast('Task deleted');
      await supabase.from('tasks').delete().eq('id', id);
    } else if(action === 'priority'){
      await updateTaskField(t.id, { priority: btn.getAttribute('data-value') });
    } else if(action === 'set-date'){
      var d = new Date(); d.setMinutes(d.getMinutes() + 60, 0, 0);
      await updateTaskField(t.id, { due_date: d.toISOString(), due: formatDueLabel(d) });
    } else if(action === 'date-prev' || action === 'date-next'){
      var d2 = new Date(t.due_date);
      d2.setDate(d2.getDate() + (action === 'date-next' ? 1 : -1));
      await updateTaskField(t.id, { due_date: d2.toISOString(), due: formatDueLabel(d2) });
    } else if(action === 'time-prev' || action === 'time-next'){
      var d3 = new Date(t.due_date);
      d3.setMinutes(d3.getMinutes() + (action === 'time-next' ? 30 : -30));
      await updateTaskField(t.id, { due_date: d3.toISOString(), due: formatDueLabel(d3) });
    }
  });

  board.addEventListener('click', async function(e){
    var actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    var row = e.target.closest('.task-row');
    var id = row.getAttribute('data-id');
    var action = actionEl.getAttribute('data-action');
    var idx = tasks.findIndex(function(t){ return String(t.id) === id; });
    if(idx === -1) return;

    if(action === 'toggle'){
      actionEl.classList.add('pulse');
      await toggleTask(id);
    } else if(action === 'delete'){
      row.classList.add('removing');
      lastDeleted = { task: tasks[idx], index: idx };
      setTimeout(function(){
        tasks = tasks.filter(function(t){ return String(t.id) !== id; });
        renderAll();
      }, 200);
      showToast('Task deleted');
      await supabase.from('tasks').delete().eq('id', id);
    } else if(action === 'open'){
      openTaskModal(id);
    }
  });

  kanban.addEventListener('click', function(e){
    var card = e.target.closest('.kcard');
    if(!card) return;
    openTaskModal(card.getAttribute('data-id'));
  });

  calStrip.addEventListener('click', function(e){
    var day = e.target.closest('.cal-day');
    if(!day) return;

    selectedCalDate = startOfDay(new Date(day.getAttribute('data-date')));
    renderAll();
  });

  filterRow.addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    currentFilter = btn.getAttribute('data-filter');
    Array.prototype.forEach.call(filterRow.querySelectorAll('.filter-btn'), function(b){ b.classList.toggle('active', b === btn); });
    renderAll();
  });

  Array.prototype.forEach.call(viewButtons, function(btn){
    btn.addEventListener('click', function(){
      currentView = btn.getAttribute('data-view');
      Array.prototype.forEach.call(viewButtons, function(b){ b.classList.toggle('active', b === btn); });
      renderAll();
    });
  });

  searchInput.addEventListener('input', function(){
    searchQuery = searchInput.value.trim();
    renderAll();
  });

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 4500);
  }

  undoBtn.addEventListener('click', async function(){
    if(!lastDeleted) return;
    var t = lastDeleted.task;
    var res = await supabase.from('tasks').insert({
      user_id: t.user_id, title: t.title, due: t.due, due_date: t.due_date,
      priority: t.priority, completed: t.completed, completed_at: t.completed_at || null
    }).select();
    if(!res.error){
      if(!tasks.some(function(x){ return String(x.id) === String(res.data[0].id); })){
        tasks.splice(lastDeleted.index, 0, res.data[0]);
      }
      renderAll();
    }
    toast.classList.remove('show');
    lastDeleted = null;
  });

  input.addEventListener('input', updatePreview);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') addTask(); });
  addBtn.addEventListener('click', addTask);
  document.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      if(!appEl.classList.contains('hidden')) input.focus();
    }
  });

  loadNotifiedIds();

  supabase.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      currentUserId = session.user.id;
      currentUserEmail = session.user.email || null;
      authScreen.classList.add('hidden');
      appEl.classList.remove('hidden');
      topRight.classList.remove('hidden');
      var emailAddr = session.user.email || '';
      avatarBtn.textContent = emailAddr.charAt(0).toUpperCase();
      avatarEmail.textContent = emailAddr;
      updateNotifyBtn();
      fetchTasks();
      subscribeRealtime();
      if(notifyInterval) clearInterval(notifyInterval);
      notifyInterval = setInterval(checkDueNotifications, 60000);
    } else {
      currentUserId = null;
      tasks = [];
      authScreen.classList.remove('hidden');
      appEl.classList.add('hidden');
      topRight.classList.add('hidden');
      avatarMenu.classList.add('hidden');
      authEmail.value = '';
      authPassword.value = '';
      if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
      if(notifyInterval){ clearInterval(notifyInterval); notifyInterval = null; }
    }
  });

  setMode('signin');
})();
</script>

</body>
</html>
